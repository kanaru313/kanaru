[package]
name = "rust_lib_kanaru"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
# cdylib is loaded by Flutter; staticlib is for future platforms; rlib lets the
# integration tests under tests/ link the crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The generated Dart code must come from the same codegen version, so the crate
# pins the exact version (see flutter_rust_bridge.yaml and pubspec.yaml).
flutter_rust_bridge = "=2.13.0"
lofty = "=0.25.4"
rayon = "1"
# Cover thumbnails: decode only the three formats covers come in, nothing else.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Large JPEG covers are decoded at 1/2..1/8 scale (DCT scaling), which the
# `image` crate's decoder cannot do. A second JPEG decoder in the binary;
# no rayon, so nothing inside a decode waits on the cover pool.
jpeg-decoder = { version = "=0.3.2", default-features = false }
# Thumbnail resize, several times faster than `image`'s (SIMD picked at run
# time). Without its rayon feature: nothing inside a resize waits on the
# cover pool.
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
# Thumbnail JPEG encoder, faster than `image`'s. `simd` only adds AVX2 code
# paths the crate takes after a run-time `is_x86_feature_detected!("avx2")`
# check, so the binary still runs on CPUs without AVX2.
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std", "simd"] }
# Cover cache keys: hash of the original image bytes. `pure` skips the C/asm build.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# O_NONBLOCK when opening sidecar images, so a FIFO named cover.jpg cannot hang a scan.
libc = "0.2"
# Atomic writes into the cover cache (temp file in the same directory, then rename).
tempfile = "3"

# Panics inside one file's tag parser are caught per file (catch_unwind), which
# only works with the default `panic = "unwind"`. Do not set `panic = "abort"`
# in any profile.

# Debug app builds (`flutter run`) use the dev profile. Unoptimized image
# decoding and resizing make cover thumbnails about 90 times slower, so a first
# scan with covers would take many minutes. The crate itself is optimized too:
# the generic `image` code it calls is compiled in this crate, so optimizing only
# the dependencies leaves the scan about twice as slow. Debug info and debug
# assertions stay on.
[profile.dev]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
